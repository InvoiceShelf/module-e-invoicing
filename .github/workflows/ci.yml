name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, dom, fileinfo, gd, iconv, libxml, mbstring, simplexml, zip, zlib
          coverage: none
          # The Composer the SDK's release workflow pins, so CI resolves as a release does.
          tools: composer:2.8.12

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # TEMPORARY until SDK 3.6.0 is tagged (InvoiceShelf/modules#15): install
      # its branch, then put composer.json back. Replace with a plain
      # `composer install` and commit composer.lock once the tag exists.
      - name: Install PHP dependencies
        run: |
          cp composer.json "$RUNNER_TEMP/composer.json"
          composer require --no-update "invoiceshelf/modules:dev-feat/invoice-documents as 3.6.0"
          # Pin every bundled package to bundle.lock, which a lock-less update would drift from.
          composer update --no-interaction --prefer-dist $(php -r '$lock = json_decode(file_get_contents("bundle.lock"), true); foreach ($lock["packages"] as $p) { echo " --with ".$p["name"].":".$p["version"]; }')
          cp "$RUNNER_TEMP/composer.json" composer.json

      - name: Fetch the host's 3.x lock and worked example
        env:
          # TEMPORARY: the worked example lands on 3.x with InvoiceShelf/InvoiceShelf#937; until then read it from that branch.
          FIXTURE_REF: feat/module-document-seams
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/composer.lock" \
            https://raw.githubusercontent.com/InvoiceShelf/InvoiceShelf/3.x/composer.lock
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/invoice-document.standard.json" \
            "https://raw.githubusercontent.com/InvoiceShelf/InvoiceShelf/${FIXTURE_REF}/tests/Fixtures/modules/invoice-document.standard.json"

      - name: The fixture is still the host's worked example
        run: diff -u "$RUNNER_TEMP/invoice-document.standard.json" tests/Fixtures/invoice-document.standard.json

      - name: Build the bundle from bundle.lock
        # Against the host's 3.x branch: a bundle that no longer fits the next
        # host release fails here before it fails a release.
        run: vendor/bin/invoiceshelf-module bundle . --host-lock="$RUNNER_TEMP/composer.lock"

      - name: Verify PHP and package contracts
        run: |
          composer run lint
          composer run test
          vendor/bin/invoiceshelf-module validate-module module.json
          vendor/bin/invoiceshelf-module validate-package .

      - name: Check the EN 16931 business rules
        env:
          MUSTANG_VERSION: 2.25.0
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/Mustang-CLI.jar" \
            "https://github.com/ZUGFeRD/mustangproject/releases/download/core-${MUSTANG_VERSION}/Mustang-CLI-${MUSTANG_VERSION}.jar"
          MUSTANG_JAR="$RUNNER_TEMP/Mustang-CLI.jar" vendor/bin/phpunit --group schematron

      - name: Verify frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm exec tsc --noEmit
          pnpm run build
          git diff --exit-code -- dist
